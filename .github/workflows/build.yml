name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hexora
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hexora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-service-renderer.cjs
      - name: Demo archive validation
        run: |
          javac -d /tmp/demo-parser src/main/java/dev/hexora/service/DemoBundle.java scripts/DemoBundleCheck.java
          java -cp /tmp/demo-parser DemoBundleCheck
      - name: Install browser for demo isolation checks
        run: |
          npm install --prefix /tmp/hexora-browser --no-save --ignore-scripts playwright@1.62.1
          node /tmp/hexora-browser/node_modules/playwright/cli.js install chromium --with-deps
      - run: ./mvnw -B -DskipTests package
      - name: Smoke check
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/hexora
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
          ADMIN_USERNAME: admin
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: change-me-for-ci
        run: |
          java -jar target/hexora-beta-1.0.0.jar > /tmp/hexora.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl --fail --silent http://127.0.0.1:8080/actuator/health && break || sleep 2; done
          curl --fail --silent http://127.0.0.1:8080/ | grep -q Hexora
          curl --fail --silent http://127.0.0.1:8080/api/auth/csrf | grep -q bearer-jwt
          python3 scripts/check-services-api.py
          python3 scripts/check-demos-api.py
          NODE_PATH=/tmp/hexora-browser/node_modules node scripts/check-demos-browser.cjs
