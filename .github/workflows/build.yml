name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - name: Smoke check
        run: |
          java -jar target/hexora-beta-1.0.0.jar > /tmp/hexora.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl --fail --silent http://127.0.0.1:8080/actuator/health && break || sleep 2; done
          curl --fail --silent http://127.0.0.1:8080/ | grep -q Hexora
          curl --fail --silent http://127.0.0.1:8080/api/auth/csrf | grep -q token
