spring.application.name=hexora-beta
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/hexora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.registration-enabled=${REGISTRATION_ENABLED:true}
app.bootstrap.username=${ADMIN_USERNAME:}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
