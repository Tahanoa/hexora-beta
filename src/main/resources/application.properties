spring.application.name=hexora-beta
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:taha}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.locations=classpath:db/migration/{vendor}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.port=${PORT:8080}
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.registration-enabled=${REGISTRATION_ENABLED:true}
app.bootstrap.username=${ADMIN_USERNAME:}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:900}
