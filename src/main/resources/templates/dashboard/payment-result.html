<!doctype html><html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتیجه پرداخت | Hexora</title><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/payments.css"></head><body class="payment-page"><main class="pay-result pay-card"><small>HEXORA / ZARINPAL</small><h1 th:text="${payment.status == 'PAID'} ? 'پرداخت با موفقیت تأیید شد' : 'پرداخت هنوز تأیید نشده است'"></h1><p th:if="${payment.status != 'PAID'}">اگر مبلغ از حساب شما کسر شده، از بخش پرداخت‌ها وضعیت را پیگیری کنید.</p><p>مبلغ: <b th:text="${payment.amount}"></b> تومان</p><p th:if="${payment.refId}">کد پیگیری: <b dir="ltr" th:text="${payment.refId}"></b></p><p>شماره فاکتور: <span dir="ltr" th:text="${payment.id}"></span></p><a class="pay-primary" href="/payments">مشاهده پرداخت‌های من</a></main></body></html>
