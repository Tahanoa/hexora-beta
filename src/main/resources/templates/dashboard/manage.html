<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مدیریت | Hexora</title><link rel="stylesheet" href="/css/dashboard.css"><script src="/js/client.js"></script>
  <style>
    :root{--bg:#0b0f14;--panel:#121820;--panel2:#18212b;--line:rgba(0,194,110,.14);--green:#00c26e;--muted:#8a94a6;--danger:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#10352a 0,transparent 32%),var(--bg);color:#f5f7fa;font-family:Tahoma,Arial,sans-serif}.manage-shell{width:min(1200px,100% - 32px);margin:0 auto;padding:28px 0 60px}.manage-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--green)}h1{margin:8px 0;font-size:clamp(1.5rem,4vw,2.4rem)}.subtitle{color:var(--muted);margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#06130d;font-weight:700}.btn.danger{color:#ff9b9b;border-color:rgba(239,68,68,.35)}.panel{background:rgba(18,24,32,.92);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 60px #0003;margin-bottom:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:.85rem;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid #2a3542;background:#0e141b;color:#f5f7fa;border-radius:10px;padding:11px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #00c26e22}.form-actions{display:flex;justify-content:flex-start;gap:10px;margin-top:16px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:680px}.data-table th,.data-table td{text-align:right;padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}.data-table th{color:var(--muted);font-size:.8rem;font-weight:500}.data-table td{font-size:.9rem}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{min-height:24px;color:var(--muted);margin:4px 0}.status.error{color:#ff9b9b}.status.ok{color:#6ff0ae}.empty{text-align:center;color:var(--muted);padding:32px}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;background:#00c26e1a;color:#73f3b6;font-size:.75rem}.switch{display:flex;align-items:center;gap:8px;color:var(--muted);padding-top:28px}.loading{opacity:.65;pointer-events:none}@media(max-width:700px){.manage-shell{width:min(100% - 20px,1200px);padding-top:16px}.manage-header{align-items:flex-start;flex-direction:column}.panel{padding:14px;border-radius:14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{width:100%}.toolbar .btn{flex:1}.data-table{min-width:560px}}
  </style>
</head>
<body>
<main class="manage-shell">
  <header class="manage-header"><div><a class="back" href="/dashboard">← بازگشت به داشبورد</a><h1 id="heading">مدیریت محتوا</h1><p class="subtitle" id="subheading">در حال بررسی دسترسی...</p></div><div class="toolbar"><button class="btn" id="refreshBtn">تازه‌سازی</button><button class="btn danger" id="logoutBtn">خروج</button></div></header>
  <section class="panel" id="editorPanel"><div class="status" id="status"></div><form id="editorForm" class="form-grid"></form><div class="form-actions"><button class="btn primary" id="saveBtn" type="submit" form="editorForm">ذخیره</button><button class="btn" id="cancelBtn" type="button">انصراف</button></div></section>
  <section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr id="tableHead"></tr></thead><tbody id="rows"><tr><td class="empty" colspan="5">در حال بارگذاری...</td></tr></tbody></table></div></section>
</main>
<script>window.HEXORA_SECTION='[[${section}]]';</script><script src="/js/manage.js"></script>
</body></html>
