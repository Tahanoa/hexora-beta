<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مدیریت | Hexora</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><script src="/js/client.js"></script>
<script src="/js/dashboard-shell.js" defer></script>

<link rel="stylesheet" href="/css/manage.css"><link rel="stylesheet" href="/css/admin-shell.css"></head>
<body class="bg-[#0B0F14] text-[#F5F7FA] min-h-screen overflow-x-hidden">
<div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
<div class="dashboard-main"><main class="manage-shell">
  <div th:replace="~{dashboard/fragments/topbar :: topbar('heading', 'subheading', 'مدیریت محتوا', 'مدیریت یکپارچه محتوا', 'languageBtn', 'manageLangText', 'refreshBtn')}"></div>
  <section class="panel" id="mediaUploadPanel" style="display:none"><div class="status" id="mediaUploadStatus"></div><form id="mediaUploadForm" class="form-grid"><div class="field"><label for="mediaFile">فایل رسانه</label><input id="mediaFile" name="file" type="file" accept="image/*,.pdf" required></div><div class="field"><label for="mediaType">نوع فایل</label><select id="mediaType" name="type"><option value="IMAGE">تصویر</option><option value="DOCUMENT">سند</option></select></div><div class="form-actions full"><button class="btn primary" type="submit">آپلود رسانه</button></div></form></section>
  <div class="status" id="status" role="status"></div><section class="panel" id="editorPanel"><form id="editorForm" class="form-grid"></form><div class="form-actions"><button class="btn primary" id="saveBtn" type="submit" form="editorForm">ذخیره</button><button class="btn" id="cancelBtn" type="button">انصراف</button></div></section>
  <section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr id="tableHead"></tr></thead><tbody id="rows"><tr class="skeleton-row"><td colspan="5"><div class="skeleton-block"></div></td></tr><tr class="skeleton-row"><td colspan="5"><div class="skeleton-block"></div></td></tr><tr class="skeleton-row"><td colspan="5"><div class="skeleton-block"></div></td></tr><tr class="skeleton-row"><td colspan="5"><div class="skeleton-block"></div></td></tr><tr class="skeleton-row"><td colspan="5"><div class="skeleton-block"></div></td></tr></tbody></table></div></section>
</main></div>
<script>window.HEXORA_SECTION='[[${section}]]';</script><script src="/js/manage.js"></script>

</body></html>
