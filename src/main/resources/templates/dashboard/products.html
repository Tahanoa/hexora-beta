<!doctype html><html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصولات | Hexora</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/admin-shell.css"><link rel="stylesheet" href="/css/products.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><script src="/js/client.js"></script><script src="/js/i18n.js"></script><script src="/js/dashboard-shell.js" defer></script><script src="/js/products-common.js" defer></script><script src="/js/products-admin.js" defer></script></head><body><div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div><main class="dashboard-main"><div class="pd-admin"><div th:replace="~{dashboard/fragments/topbar :: topbar('pdTitle','pdSubtitle','محصولات','مدیریت محصولات دیجیتال و نسخه‌های خصوصی','pdLanguage','pdLanguageText','pdRefresh')}"></div><div class="admin-content-actions"><button id="pdNew" class="pd-button pd-primary" data-i18n-fa="محصول جدید +" data-i18n-en="New product +">محصول جدید +</button></div><p id="pdMessage" role="status" aria-live="polite"></p><div id="pdList" class="pd-grid"></div><div class="pd-pagination"><button id="pdPrev" class="pd-button" data-i18n-fa="قبلی" data-i18n-en="Previous">قبلی</button><output id="pdPage"></output><button id="pdNext" class="pd-button" data-i18n-fa="بعدی" data-i18n-en="Next">بعدی</button></div></div></main>
<dialog id="pdDialog" class="pd-dialog"><header><h2 id="pdEditTitle">محصول</h2><button class="pd-button" type="button" data-close aria-label="Close">×</button></header><form id="pdForm" class="pd-fields">
<label><span data-i18n-fa="عنوان فارسی" data-i18n-en="Persian title">عنوان فارسی</span><input name="title" maxlength="150" required></label><label><span data-i18n-fa="عنوان انگلیسی" data-i18n-en="English title">عنوان انگلیسی</span><input name="titleEn" maxlength="150"></label>
<label><span data-i18n-fa="آدرس ثابت انگلیسی" data-i18n-en="Permanent English slug">آدرس ثابت انگلیسی</span><input name="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="80" required dir="ltr"></label><label><span data-i18n-fa="قیمت · تومان (۰ برای رایگان)" data-i18n-en="Price · toman (0 for free)">قیمت · تومان (۰ برای رایگان)</span><input name="price" type="number" min="0" max="1000000000" step="1" required></label>
<label><span data-i18n-fa="دسته‌بندی" data-i18n-en="Category">دسته‌بندی</span><input name="category" maxlength="80"></label><label><span data-i18n-fa="تصویر کاور" data-i18n-en="Cover image">تصویر کاور</span><select name="coverId" id="pdCover"></select></label>
<label class="pd-wide"><span data-i18n-fa="توضیحات فارسی" data-i18n-en="Persian description">توضیحات فارسی</span><textarea name="description" maxlength="20000" rows="5"></textarea></label><label class="pd-wide"><span data-i18n-fa="توضیحات انگلیسی" data-i18n-en="English description">توضیحات انگلیسی</span><textarea name="descriptionEn" maxlength="20000" rows="4"></textarea></label>
<label class="pd-wide"><span data-i18n-fa="پیش‌نیازها و راهنمای نصب" data-i18n-en="Requirements & installation">پیش‌نیازها و راهنمای نصب</span><textarea name="requirements" maxlength="10000" rows="3"></textarea></label><label class="pd-wide"><span data-i18n-fa="لینک دمو · HTTPS" data-i18n-en="Demo URL · HTTPS">لینک دمو · HTTPS</span><input name="demoUrl" type="url" maxlength="500" dir="ltr"></label><label class="pd-check pd-wide"><input name="published" type="checkbox"><span data-i18n-fa="انتشار محصول (پس از انتشار نسخه)" data-i18n-en="Publish product (after publishing a release)">انتشار محصول (پس از انتشار نسخه)</span></label><button class="pd-button pd-primary pd-wide" type="submit" data-i18n-fa="ذخیره محصول" data-i18n-en="Save product">ذخیره محصول</button><p id="pdFormMessage" class="pd-wide" role="status"></p></form></dialog>
<dialog id="pdReleasesDialog" class="pd-dialog"><header><h2 id="pdReleaseTitle">نسخه‌ها</h2><button type="button" class="pd-button" data-close aria-label="Close">×</button></header><p class="pd-muted" data-i18n-fa="فایل ZIP تا ۸ مگابایت. فایل را پیش از انتشار بررسی کنید؛ نسخه منتشرشده قابل جایگزینی نیست، نسخه جدید بسازید." data-i18n-en="ZIP up to 8 MB. Review the file before publishing. Files are immutable; upload a new version for changes.">فایل ZIP تا ۸ مگابایت. فایل را پیش از انتشار بررسی کنید؛ نسخه منتشرشده قابل جایگزینی نیست، نسخه جدید بسازید.</p><form id="pdUpload" class="pd-fields"><label><span data-i18n-fa="شماره نسخه" data-i18n-en="Version">شماره نسخه</span><input name="version" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,49}" placeholder="1.0.0" required dir="ltr"></label><label><span data-i18n-fa="فایل ZIP خصوصی" data-i18n-en="Private ZIP file">فایل ZIP خصوصی</span><input name="file" type="file" accept=".zip" required></label><label class="pd-wide"><span data-i18n-fa="تغییرات این نسخه" data-i18n-en="Release notes">تغییرات این نسخه</span><textarea name="changelog" rows="3" maxlength="10000"></textarea></label><button class="pd-button pd-primary pd-wide" type="submit" data-i18n-fa="آپلود نسخه پیش‌نویس" data-i18n-en="Upload draft release">آپلود نسخه پیش‌نویس</button></form><p id="pdReleaseMessage" role="status"></p><div id="pdVersions"></div></dialog></body></html>
