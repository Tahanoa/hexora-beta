<!doctype html><html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n-fa="مدیریت کاربران | Hexora" data-i18n-en="User management | Hexora">مدیریت کاربران | Hexora</title><link rel="stylesheet" href="/css/notifications.css"><script src="/js/notifications.js"></script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/admin-shell.css"><link rel="stylesheet" href="/css/products.css"><link rel="stylesheet" href="/css/users.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><script src="/js/client.js"></script><script src="/js/i18n.js"></script><script src="/js/dashboard-shell.js" defer></script><script src="/js/users-admin.js" defer></script></head><body><div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div><main class="dashboard-main"><div class="pd-admin users-admin"><div th:replace="~{dashboard/fragments/topbar :: topbar('usersTitle','usersSubtitle','مدیریت کاربران','حساب‌ها، نقش‌ها و دسترسی کاربران','usersLanguage','usersLanguageText','usersRefresh')}"></div><div id="usersStats" class="pd-admin-stats"></div><div class="pd-admin-toolbar"><label><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="usersSearch" type="search" maxlength="200" placeholder="جست‌وجوی نام کاربری، ایمیل یا تلفن" data-i18n-placeholder-fa="جست‌وجوی نام کاربری، ایمیل یا تلفن" data-i18n-placeholder-en="Search username, email or phone" aria-label="جست‌وجوی کاربران" data-i18n-aria-label-fa="جست‌وجوی کاربران" data-i18n-aria-label-en="Search users"></label><select id="usersState" aria-label="وضعیت حساب" data-i18n-aria-label-fa="وضعیت حساب" data-i18n-aria-label-en="Account status"><option value="ALL" data-i18n-fa="همه حساب‌ها" data-i18n-en="All accounts">همه حساب‌ها</option><option value="ENABLED" data-i18n-fa="فعال" data-i18n-en="Enabled">فعال</option><option value="DISABLED" data-i18n-fa="غیرفعال" data-i18n-en="Disabled">غیرفعال</option></select><select id="usersRole" aria-label="نقش" data-i18n-aria-label-fa="نقش" data-i18n-aria-label-en="Role"><option value="" data-i18n-fa="همه نقش‌ها" data-i18n-en="All roles">همه نقش‌ها</option><option value="USER" data-i18n-fa="کاربر" data-i18n-en="User">کاربر</option><option value="ADMIN" data-i18n-fa="ادمین" data-i18n-en="Admin">ادمین</option><option value="EDITOR" data-i18n-fa="ویرایشگر" data-i18n-en="Editor">ویرایشگر</option><option value="VIEWER" data-i18n-fa="بیننده" data-i18n-en="Viewer">بیننده</option></select><span id="usersCount" class="pd-muted" aria-live="polite"></span></div><div id="usersList" class="users-list" aria-busy="true"></div><div class="pd-pagination"><button id="usersPrev" class="pd-button" data-i18n-fa="قبلی" data-i18n-en="Previous">قبلی</button><output id="usersPage"></output><button id="usersNext" class="pd-button" data-i18n-fa="بعدی" data-i18n-en="Next">بعدی</button></div></div></main><dialog id="usersDialog" class="pd-dialog"><header><h2 data-i18n-fa="مدیریت حساب" data-i18n-en="Manage account">مدیریت حساب</h2><button id="usersClose" type="button" class="pd-button" aria-label="بستن" data-i18n-aria-label-fa="بستن" data-i18n-aria-label-en="Close">×</button></header><div id="usersIdentity" class="users-identity"></div><form id="usersForm" class="pd-fields"><label><span data-i18n-fa="ایمیل" data-i18n-en="Email">ایمیل</span><input name="email" type="email" maxlength="150" required dir="ltr"></label><label><span data-i18n-fa="شماره تماس" data-i18n-en="Phone">شماره تماس</span><input name="phone" type="tel" maxlength="16" pattern="\+?[0-9]{8,15}|" dir="ltr"></label><label><span data-i18n-fa="نقش حساب" data-i18n-en="Account role">نقش حساب</span><select name="role"><option value="USER" data-i18n-fa="کاربر" data-i18n-en="User">کاربر</option><option value="ADMIN" data-i18n-fa="ادمین" data-i18n-en="Admin">ادمین</option><option value="EDITOR" data-i18n-fa="ویرایشگر" data-i18n-en="Editor">ویرایشگر</option><option value="VIEWER" data-i18n-fa="بیننده" data-i18n-en="Viewer">بیننده</option></select></label><label class="pd-check"><input name="enabled" type="checkbox"><span data-i18n-fa="حساب فعال باشد" data-i18n-en="Account enabled">حساب فعال باشد</span></label><p id="usersSelfNote" class="pd-muted pd-wide" hidden data-i18n-fa="نقش و وضعیت حساب خودتان از این صفحه قابل تغییر نیست." data-i18n-en="You cannot change your own role or disable your account here.">نقش و وضعیت حساب خودتان از این صفحه قابل تغییر نیست.</p><p class="pd-muted pd-wide" data-i18n-fa="تغییر مشخصات یا دسترسی، ورود مجدد این کاربر را ضروری می‌کند. نام کاربری ثابت است و سوابق خرید حفظ می‌شوند." data-i18n-en="Changing account details or access requires this user to sign in again. The username stays fixed and purchases are preserved.">تغییر مشخصات یا دسترسی، ورود مجدد این کاربر را ضروری می‌کند. نام کاربری ثابت است و سوابق خرید حفظ می‌شوند.</p><div class="pd-actions pd-wide"><button id="usersSave" type="submit" class="pd-button pd-primary" data-i18n-fa="ذخیره تغییرات" data-i18n-en="Save changes">ذخیره تغییرات</button><button id="usersRevoke" type="button" class="pd-button pd-danger" data-i18n-fa="خروج از همه دستگاه‌ها" data-i18n-en="Sign out all devices">خروج از همه دستگاه‌ها</button></div></form></dialog></body></html>
