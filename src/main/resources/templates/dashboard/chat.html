<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>گفتگوها | Hexora</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/manage.css"><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><script src="/js/client.js"></script>
  <style>
    .skeleton-row td{padding:10px}.skeleton-block{height:15px;border-radius:8px;background:linear-gradient(90deg,#18232d,#304452,#18232d);background-size:200% 100%;animation:manageShimmer 1.25s linear infinite}@keyframes manageShimmer{to{background-position:-200% 0}}.manage-menu-toggle{display:none}.lang-btn{min-width:86px}
    :root{--bg:#0b0f14;--panel:#121820;--panel2:#18212b;--line:rgba(0,194,110,.14);--green:#00c26e;--muted:#8a94a6;--danger:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#10352a 0,transparent 32%),var(--bg);color:#f5f7fa;font-family:var(--font-fa),Tahoma,Arial,sans-serif}.manage-shell{width:min(1200px,100% - 32px);margin:0 auto;padding:28px 0 60px}.manage-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--green)}h1{margin:8px 0;font-size:clamp(1.5rem,4vw,2.4rem)}.subtitle{color:var(--muted);margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#06130d;font-weight:700}.btn.danger{color:#ff9b9b;border-color:rgba(239,68,68,.35)}.panel{background:rgba(18,24,32,.92);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 60px #0003;margin-bottom:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:.85rem;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid #2a3542;background:#0e141b;color:#f5f7fa;border-radius:10px;padding:11px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #00c26e22}.form-actions.full{grid-column:1/-1}.icon-picker{position:relative}.icon-picker-row{display:flex;gap:8px}.icon-picker-row input{flex:1}.icon-preview{width:45px;min-width:45px;border:1px solid #2a3542;background:#0e141b;color:var(--green);border-radius:10px;display:grid;place-items:center;font-size:1.1rem}.icon-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;padding:8px;margin-top:5px;border:1px solid #2a3542;background:#111a23;border-radius:10px;max-height:360px;overflow:auto}.icon-option{border:1px solid transparent;background:#18232d;color:#cbd5df;border-radius:8px;padding:8px;cursor:pointer}.icon-option:hover,.icon-option.selected{border-color:var(--green);color:var(--green);background:#00c26e18}.icon-option small{display:block;font-size:10px;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:7px}.icon-option i{font-size:22px}.icon-style{max-width:140px}.icon-pagination{display:flex;align-items:center;justify-content:center;gap:15px}.icon-pagination button:disabled{opacity:.4;cursor:default}.icon-empty{grid-column:1/-1;padding:20px;text-align:center}.icon-help{font-size:.72rem;color:var(--muted)}.form-actions{display:flex;justify-content:flex-start;gap:10px;margin-top:16px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:680px}.data-table th,.data-table td{text-align:right;padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}.data-table th{color:var(--muted);font-size:.8rem;font-weight:500}.data-table td{font-size:.9rem}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{min-height:24px;color:var(--muted);margin:4px 0}.status.error{color:#ff9b9b}.status.ok{color:#6ff0ae}.empty{text-align:center;color:var(--muted);padding:32px}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;background:#00c26e1a;color:#73f3b6;font-size:.75rem}.switch{display:flex;align-items:center;gap:8px;color:var(--muted);padding-top:28px}.loading{opacity:.65;pointer-events:none}@media(max-width:700px){.manage-shell{width:min(100% - 20px,1200px);padding-top:16px}.manage-header{align-items:flex-start;flex-direction:column}.panel{padding:14px;border-radius:14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{width:100%}.toolbar .btn{flex:1}.data-table{min-width:560px}}
  @media(max-width:1024px){.manage-menu-toggle{display:inline-flex;margin-inline-end:8px}.dashboard-main{padding:16px}.manage-shell{width:100%}}
  </style>
<script src="/js/dashboard-shell.js" defer></script>

<body>
<div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
<div class="dashboard-main"><main class="manage-shell chat-admin" data-chat-admin="true"><header class="manage-header"><div><button class="btn" type="button" onclick="toggleSidebar()" aria-label="نمایش منو">☰</button><h1>گفتگوهای کاربران</h1><p class="subtitle">پاسخ‌گویی مستقیم به کاربران ثبت‌نام‌شده</p></div><button class="btn" id="chatLang" type="button">EN</button></header><div id="chatGate" class="chat-gate" role="status"></div><section class="chat-app" hidden><aside id="chatConversations" class="chat-conversations" hidden></aside><div class="chat-room"><header class="chat-room-header"><div><h2 id="chatRoomTitle">گفتگو با من</h2><p id="chatRoomMeta">پیام‌ها و پاسخ‌ها در حساب شما ذخیره می‌شوند.</p></div><span class="chat-live">●</span></header><details id="chatPhoneSettings" class="chat-phone-settings"><summary>شماره تماس حساب</summary><form id="chatPhoneForm"><label for="chatPhone">شماره تماس</label><input id="chatPhone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="09123456789" required><button type="submit">ذخیره شماره</button><span id="phoneStatus" role="status"></span></form></details><button id="olderMessages" class="older-messages" type="button" hidden>پیام‌های قبلی</button><div id="chatMessages" class="chat-messages" aria-live="polite" aria-relevant="additions"><div class="chat-skeleton"></div></div><form id="chatComposer" class="chat-composer"><label for="chatText" class="chat-sr">متن پیام</label><textarea id="chatText" rows="2" maxlength="4000" placeholder="پیام خود را بنویسید…" required></textarea><div class="chat-composer-actions"><label for="chatFile" class="chat-attach"><i class="fa-solid fa-paperclip" aria-hidden="true"></i><span>فایل متنی .txt</span></label><input id="chatFile" type="file" accept=".txt,text/plain" hidden><button id="chatSend" type="submit">ارسال <i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button></div><small>فقط متن یا فایل UTF-8 با پسوند .txt؛ حداکثر ۴۰۰۰ کاراکتر و ۱۶ کیلوبایت.</small></form><p id="chatStatus" class="chat-status" role="status"></p></div></section></main></div><script src="/js/chat.js"></script></body></html>
