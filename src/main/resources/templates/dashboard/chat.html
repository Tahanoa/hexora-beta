<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n-fa="گفتگوها | Hexora" data-i18n-en="Conversations | Hexora">گفتگوها | Hexora</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><script src="/js/client.js"></script>
<script src="/js/dashboard-shell.js" defer></script>

<link rel="stylesheet" href="/css/chat.css"><link rel="stylesheet" href="/css/manage.css"><link rel="stylesheet" href="/css/admin-shell.css"><script src="/js/i18n.js"></script></head>
<body>
<div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
<div class="dashboard-main"><main class="manage-shell chat-admin" data-chat-admin="true"><div th:replace="~{dashboard/fragments/topbar :: topbar('chatPageTitle', 'chatPageSubtitle', 'گفتگوهای کاربران', 'پاسخ‌گویی مستقیم به کاربران ثبت‌نام‌شده', 'chatLang', 'chatLangText', '')}"></div><div id="chatGate" class="chat-gate" role="status"></div><section class="chat-app" hidden><aside id="chatConversations" class="chat-conversations" hidden></aside><div class="chat-room"><header class="chat-room-header"><div><h2 id="chatRoomTitle"><span data-i18n-fa="گفتگو با من" data-i18n-en="Chat with me">گفتگو با من</span></h2><p id="chatRoomMeta"><span data-i18n-fa="پیام‌ها و پاسخ‌ها در حساب شما ذخیره می‌شوند." data-i18n-en="Messages and replies are saved in your account.">پیام‌ها و پاسخ‌ها در حساب شما ذخیره می‌شوند.</span></p></div><span class="chat-live">●</span></header><details id="chatPhoneSettings" class="chat-phone-settings"><summary><span data-i18n-fa="شماره تماس حساب" data-i18n-en="Account phone number">شماره تماس حساب</span></summary><form id="chatPhoneForm"><label for="chatPhone"><span data-i18n-fa="شماره تماس" data-i18n-en="Phone number">شماره تماس</span></label><input id="chatPhone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="09123456789" required><button type="submit"><span data-i18n-fa="ذخیره شماره" data-i18n-en="Save phone number">ذخیره شماره</span></button><span id="phoneStatus" role="status"></span></form></details><button id="olderMessages" class="older-messages" type="button" hidden><span data-i18n-fa="پیام‌های قبلی" data-i18n-en="Earlier messages">پیام‌های قبلی</span></button><div id="chatMessages" class="chat-messages" aria-live="polite" aria-relevant="additions"><div class="chat-skeleton"></div></div><form id="chatComposer" class="chat-composer"><label for="chatText" class="chat-sr"><span data-i18n-fa="متن پیام" data-i18n-en="Message">متن پیام</span></label><textarea id="chatText" rows="2" maxlength="4000" placeholder="پیام خود را بنویسید…" required data-i18n-placeholder-fa="پیام خود را بنویسید…" data-i18n-placeholder-en="Write your message…"></textarea><div class="chat-composer-actions"><label for="chatFile" class="chat-attach"><i class="fa-solid fa-paperclip" aria-hidden="true"></i><span><span data-i18n-fa="فایل متنی .txt" data-i18n-en="Text file .txt">فایل متنی .txt</span></span></label><input id="chatFile" type="file" accept=".txt,text/plain" hidden><button id="chatSend" type="submit"><span data-i18n-fa="ارسال" data-i18n-en="Send">ارسال</span> <i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button></div><small><span data-i18n-fa="فقط متن یا فایل UTF-8 با پسوند .txt؛ حداکثر ۴۰۰۰ کاراکتر و ۱۶ کیلوبایت." data-i18n-en="Text or UTF-8 .txt only; up to 4,000 characters and 16 KB.">فقط متن یا فایل UTF-8 با پسوند .txt؛ حداکثر ۴۰۰۰ کاراکتر و ۱۶ کیلوبایت.</span></small></form><p id="chatStatus" class="chat-status" role="status"></p></div></section></main></div><script src="/js/chat.js"></script></body></html>
