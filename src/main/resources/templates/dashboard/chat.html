<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>گفتگوها | Hexora</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><script src="/js/client.js"></script>
<script src="/js/dashboard-shell.js" defer></script>

<link rel="stylesheet" href="/css/chat.css"><link rel="stylesheet" href="/css/manage.css"><link rel="stylesheet" href="/css/admin-shell.css"></head>
<body>
<div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
<div class="dashboard-main"><main class="manage-shell chat-admin" data-chat-admin="true"><div th:replace="~{dashboard/fragments/topbar :: topbar('chatPageTitle', 'chatPageSubtitle', 'گفتگوهای کاربران', 'پاسخ‌گویی مستقیم به کاربران ثبت‌نام‌شده', 'chatLang', 'chatLangText', '', '', '')}"></div><div id="chatGate" class="chat-gate" role="status"></div><section class="chat-app" hidden><aside id="chatConversations" class="chat-conversations" hidden></aside><div class="chat-room"><header class="chat-room-header"><div><h2 id="chatRoomTitle">گفتگو با من</h2><p id="chatRoomMeta">پیام‌ها و پاسخ‌ها در حساب شما ذخیره می‌شوند.</p></div><span class="chat-live">●</span></header><details id="chatPhoneSettings" class="chat-phone-settings"><summary>شماره تماس حساب</summary><form id="chatPhoneForm"><label for="chatPhone">شماره تماس</label><input id="chatPhone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="09123456789" required><button type="submit">ذخیره شماره</button><span id="phoneStatus" role="status"></span></form></details><button id="olderMessages" class="older-messages" type="button" hidden>پیام‌های قبلی</button><div id="chatMessages" class="chat-messages" aria-live="polite" aria-relevant="additions"><div class="chat-skeleton"></div></div><form id="chatComposer" class="chat-composer"><label for="chatText" class="chat-sr">متن پیام</label><textarea id="chatText" rows="2" maxlength="4000" placeholder="پیام خود را بنویسید…" required></textarea><div class="chat-composer-actions"><label for="chatFile" class="chat-attach"><i class="fa-solid fa-paperclip" aria-hidden="true"></i><span>فایل متنی .txt</span></label><input id="chatFile" type="file" accept=".txt,text/plain" hidden><button id="chatSend" type="submit">ارسال <i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button></div><small>فقط متن یا فایل UTF-8 با پسوند .txt؛ حداکثر ۴۰۰۰ کاراکتر و ۱۶ کیلوبایت.</small></form><p id="chatStatus" class="chat-status" role="status"></p></div></section></main></div><script src="/js/chat.js"></script></body></html>
