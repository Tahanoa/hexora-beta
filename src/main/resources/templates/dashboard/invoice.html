<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>فاکتور | Hexora</title><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/payments.css"><script src="/js/invoice.js" defer></script></head>
<body class="payment-page"><main class="pay-shell pay-public"><section class="pay-card" th:attr="data-invoice-id=${invoiceId}" id="invoice"><small>HEXORA / INVOICE</small><h1>فاکتور پرداخت</h1><p id="invoiceMessage" role="status" aria-live="polite">در حال دریافت فاکتور…</p><h2 id="invoiceDescription"></h2><div class="invoice-amount"><b id="invoiceAmount">—</b><span> تومان</span></div><dl class="invoice-details"><dt>شماره فاکتور</dt><dd id="invoiceNumber" dir="ltr"></dd><dt>وضعیت</dt><dd id="invoiceStatus"></dd><dt>تاریخ صدور</dt><dd id="invoiceDate"></dd><dt id="invoiceRefLabel" hidden>کد پیگیری</dt><dd id="invoiceRef" dir="ltr" hidden></dd></dl><div class="pay-actions"><button id="invoicePay" class="pay-primary" hidden>پرداخت با زرین‌پال</button><button id="invoiceVerify" hidden>پیگیری پرداخت</button></div><p class="pay-muted">پرداخت امن از طریق درگاه زرین‌پال</p></section></main></body></html>
